<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Alfred — Painel da Vida</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --line: #2a2f3a;
    --text: #e7e9ee; --muted: #9aa1ae; --accent: #6ea8fe;
    --alta: #ff6b6b; --media: #f7b955; --baixa: #5cc8a1;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f6f8; --panel: #ffffff; --panel-2: #f0f2f5; --line: #e1e4ea;
            --text: #1b1f27; --muted: #5d6573; --accent: #2f6fdb; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); }

  /* Login */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login-card { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line);
                border-radius: 14px; padding: 32px 28px; }
  .login-card h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: -0.01em; }
  .login-card p { margin: 0 0 24px; color: var(--muted); }
  .login-card label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .login-card input { width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line);
                      background: var(--panel-2); color: var(--text); font-size: 15px; }
  .login-card input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .login-card button { width: 100%; margin-top: 16px; padding: 11px; border: 0; border-radius: 8px;
                       background: var(--accent); color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; }
  .login-card button:disabled { opacity: .6; cursor: progress; }
  .error { color: var(--alta); font-size: 13px; min-height: 20px; margin-top: 10px; }

  /* App */
  #app { display: none; max-width: 1100px; margin: 0 auto; padding: 20px 20px 60px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 22px; }
  header .meta { color: var(--muted); font-size: 13px; }
  header button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px;
                  padding: 6px 12px; cursor: pointer; }
  nav { display: flex; gap: 6px; overflow-x: auto; margin: 18px 0 20px; padding-bottom: 4px;
        border-bottom: 1px solid var(--line); }
  nav button { flex: none; background: none; border: 0; color: var(--muted); padding: 10px 12px; cursor: pointer;
               font-size: 14px; border-bottom: 2px solid transparent; margin-bottom: -5px; }
  nav button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .count { display: inline-block; min-width: 18px; padding: 0 6px; margin-left: 4px; border-radius: 9px;
           background: var(--alta); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }
  .summary { color: var(--muted); margin: 0 0 18px; }

  .days { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .day { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .day.today { border-color: var(--accent); }
  .day h3 { margin: 0 0 10px; font-size: 15px; display: flex; justify-content: space-between; }
  .day h3 small { color: var(--accent); font-weight: 600; }

  .task { background: var(--panel-2); border-radius: 10px; padding: 12px; margin-bottom: 10px;
          border-left: 3px solid var(--line); }
  .task.alta { border-left-color: var(--alta); }
  .task.media { border-left-color: var(--media); }
  .task.baixa { border-left-color: var(--baixa); }
  .task.done { opacity: .5; }
  .task.done .t-title { text-decoration: line-through; }
  .t-head { display: flex; gap: 10px; align-items: flex-start; }
  .t-head input { margin-top: 4px; width: 16px; height: 16px; flex: none; accent-color: var(--accent); }
  .t-title { font-weight: 600; }
  .t-detail { color: var(--muted); font-size: 14px; margin: 6px 0 0 26px; }
  .t-deadline { font-size: 13px; margin: 6px 0 0 26px; }
  .t-links { margin: 8px 0 0 26px; display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
  .badge { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: 1px 6px; border-radius: 4px;
           margin-left: 6px; vertical-align: 1px; }
  .badge.alta { background: color-mix(in srgb, var(--alta) 20%, transparent); color: var(--alta); }
  .badge.media { background: color-mix(in srgb, var(--media) 20%, transparent); color: var(--media); }
  .badge.baixa { background: color-mix(in srgb, var(--baixa) 20%, transparent); color: var(--baixa); }

  h2.section { font-size: 16px; margin: 28px 0 10px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line);
          border-radius: 12px; overflow: hidden; font-size: 14px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; background: var(--panel-2); }
  tr:last-child td { border-bottom: 0; }
  .item-date { color: var(--muted); font-size: 12px; margin-left: 26px; }

  /* Finanças */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 8px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
         border-radius: 12px; padding: 12px 14px; }
  .kpi .k-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .kpi .k-value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .kpi .k-sub { color: var(--muted); font-size: 12px; }
  .kpi.neg { border-left-color: var(--alta); } .kpi.neg .k-value { color: var(--alta); }
  .kpi.pos { border-left-color: var(--baixa); } .kpi.pos .k-value { color: var(--baixa); }
  .fin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
  .fin-grid h2.section { margin-top: 20px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.muted { color: var(--muted); font-size: 13px; }
  tr.total td { font-weight: 700; background: var(--panel-2); }
  .bar { height: 6px; border-radius: 3px; background: var(--accent); opacity: .75; margin-top: 4px; }
  .note { color: var(--muted); font-size: 13px; margin: 8px 2px 0; }

  /* Guias */
  .guias { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
  .guia { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .guia h3 { margin: 0 0 8px; font-size: 16px; }
  .g-tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--panel-2);
           color: var(--muted); margin: 0 6px 4px 0; }
  .g-tag.urg { background: color-mix(in srgb, var(--alta) 20%, transparent); color: var(--alta); font-weight: 600; }
</style>
</head>
<body>

<main id="login">
  <form class="login-card" id="login-form" autocomplete="off">
    <h1>Alfred</h1>
    <p>Seu painel pessoal. Entre com sua senha.</p>
    <label for="pw">Senha</label>
    <input id="pw" type="password" autofocus required>
    <button id="enter" type="submit">Entrar</button>
    <div class="error" id="err" role="alert"></div>
  </form>
</main>

<div id="app">
  <header>
    <div>
      <h1>Painel da Vida</h1>
      <div class="meta" id="meta"></div>
    </div>
    <button id="logout" type="button">Sair</button>
  </header>
  <nav id="tabs" role="tablist"></nav>
  <section id="panel" role="tabpanel"></section>
</div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = iso => new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' });
const todayISO = () => new Date().toLocaleDateString('sv-SE');

async function decrypt(password) {
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const aes = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iterations, hash: 'SHA-256' },
    key, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, aes, b64(PAYLOAD.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

// Checkbox state lives in localStorage, keyed by task title
const doneKey = 'alfred-done';
const getDone = () => new Set(JSON.parse(localStorage.getItem(doneKey) || '[]'));
function toggleDone(id, on) {
  const s = getDone(); on ? s.add(id) : s.delete(id);
  localStorage.setItem(doneKey, JSON.stringify([...s]));
}

function taskHTML(t, extraDate) {
  const done = getDone().has(t.title);
  const links = (t.links || []).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join('');
  return `<div class="task ${esc(t.priority)}${done ? ' done' : ''}">
    <label class="t-head">
      <input type="checkbox" data-id="${esc(t.title)}" ${done ? 'checked' : ''}>
      <span class="t-title">${esc(t.title)}<span class="badge ${esc(t.priority)}">${esc(t.priority === 'media' ? 'média' : t.priority)}</span></span>
    </label>
    ${extraDate ? `<div class="item-date">${esc(fmtDate(t.date))}</div>` : ''}
    ${t.detail ? `<div class="t-detail">${esc(t.detail)}</div>` : ''}
    ${t.deadline ? `<div class="t-deadline">⏰ ${esc(t.deadline)}</div>` : ''}
    ${links ? `<div class="t-links">${links}</div>` : ''}
  </div>`;
}

const brl = n => (n ?? 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const mesNome = ym => new Date(ym + '-01T12:00:00').toLocaleDateString('pt-BR', { month: 'short', year: '2-digit' });
const sum = (arr, f = x => x.valor) => arr.reduce((s, x) => s + (f(x) || 0), 0);

function budgetHTML(b) {
  const c = b.cartao;
  const renda = sum(b.renda), rendaFixa = sum(b.renda.filter(r => !r.variavel));
  const fixas = sum(b.fixas);
  const cartoes = (c ? c.compras : 0) + sum(b.outrosCartoes || []);
  const saidas = fixas + cartoes, sobra = renda - saidas, sobraSem = rendaFixa - saidas;
  const kpi = (label, v, sub, cls = '') =>
    `<div class="kpi ${cls}"><div class="k-label">${esc(label)}</div><div class="k-value">${brl(v)}</div><div class="k-sub">${esc(sub)}</div></div>`;
  const row = (cells) => `<tr>${cells.join('')}</tr>`;
  const td = (v, cls = '') => `<td class="${cls}">${v}</td>`;

  let h = '<div class="kpis">'
    + kpi('Entra no mês', renda, b.renda.map(r => r.nome.split(' ')[0]).join(' + '))
    + kpi('Sai no mês', saidas, `cartões ${brl(cartoes)} + contas ${brl(fixas)}`)
    + kpi('Sobra', sobra, 'com a Huna', sobra < 0 ? 'neg' : 'pos')
    + kpi('Sobra sem a Huna', sobraSem, 'só com o salário', sobraSem < 0 ? 'neg' : 'pos')
    + '</div>';
  if (b.nota) h += `<p class="note">${esc(b.nota)}</p>`;

  h += '<div class="fin-grid"><div>';
  h += `<h2 class="section">Entradas</h2><table><tbody>
    ${b.renda.map(r => row([td(esc(r.nome)), td(esc(r.obs || ''), 'muted'), td(brl(r.valor), 'num')])).join('')}
    <tr class="total"><td>Total</td><td></td><td class="num">${brl(renda)}</td></tr></tbody></table>`;
  h += `<h2 class="section">Contas fixas</h2><table><tbody>
    ${b.fixas.map(f => row([td(esc(f.nome)), td(esc(f.obs || (f.vence ? 'vence dia ' + f.vence : 'vencimento ?')), 'muted'), td(brl(f.valor), 'num')])).join('')}
    <tr class="total"><td>Total</td><td></td><td class="num">${brl(fixas)}</td></tr></tbody></table>`;
  h += `<h2 class="section">Cartões — faturas deste mês</h2><table>
    <thead><tr><th>Cartão</th><th>Vence</th><th class="num">Valor</th></tr></thead><tbody>
    ${c ? row([td('Nubank'), td(esc(fmtDate(c.vencimento)) + (c.pagamentos[0] ? `<div class="muted">adiantou ${brl(c.pagamentos[0].valor)} em ${esc(fmtDate(c.pagamentos[0].date))}</div>` : '')), td(brl(c.compras), 'num')]) : ''}
    ${(b.outrosCartoes || []).map(o => row([td(esc(o.nome)), td(esc(fmtDate(o.vencimento))), td(brl(o.valor), 'num')])).join('')}
    <tr class="total"><td>Total</td><td></td><td class="num">${brl(cartoes)}</td></tr></tbody></table>`;
  if (c) h += `<p class="note">Nubank = soma das ${c.qtdCompras} compras do ciclo ${esc(c.periodo.map(d => d.slice(8, 10) + '/' + d.slice(5, 7)).join(' a '))} (arquivo ${esc(c.arquivo)}). O valor exato a pagar está no app.</p>`;
  h += '</div><div>';

  if (c) {
    const max = c.categorias[0]?.valor || 1;
    h += `<h2 class="section">Onde o cartão foi gasto</h2><table><tbody>
      ${c.categorias.map(k => row([td(`${esc(k.nome)}<div class="bar" style="width:${(k.valor / max * 100).toFixed(0)}%"></div>`), td(k.qtd + 'x', 'muted num'), td(brl(k.valor), 'num'), td(Math.round(k.valor / c.compras * 100) + '%', 'muted num')])).join('')}
      </tbody></table>`;
    h += `<h2 class="section">Parcelas já comprometidas nas próximas faturas</h2><table>
      <thead><tr><th>Fatura</th><th class="num">Parcelas</th><th class="num">Valor</th></tr></thead><tbody>
      ${c.comprometido.map(m => row([td(esc(mesNome(m.mes))), td(m.qtd, 'num muted'), td(brl(m.valor), 'num')])).join('')}
      </tbody></table>
      <p class="note">Só parcelas antigas — sem contar nenhuma compra nova.</p>`;
  }
  h += '</div></div>';

  if (c) {
    h += `<h2 class="section">Todas as parcelas (${c.parcelas.length}) — ${brl(c.totalParcelas)} nesta fatura</h2><table>
      <thead><tr><th>Compra</th><th>Parcela</th><th class="num">Valor</th><th class="num">Ainda falta</th><th>Última</th></tr></thead><tbody>
      ${c.parcelas.map(p => row([td(esc(p.nome)), td(esc(p.parcela), 'muted'), td(brl(p.valor), 'num'), td(p.restam ? brl(p.falta) : '✔ acabou', 'num'), td(esc(mesNome(p.ultima)), 'muted')])).join('')}
      </tbody></table>`;
  }
  if (b.cortes?.length) {
    const eco = sum(b.cortes, x => x.economia);
    h += `<h2 class="section">Plano de cortes — até ${brl(eco)}/mês (sobra iria para ${brl(sobra + eco)})</h2>`
      + b.cortes.map(t => taskHTML(t)).join('');
  }
  return h;
}

function trilhaHTML(t) {
  const done = new Set(JSON.parse(localStorage.getItem('trilha-ia-done') || '[]'));
  const semanas = t.calendario.filter(c => !c.pausa);
  const hoje = todayISO();
  const atual = semanas.find(s => hoje <= s.fim) || semanas.at(-1);
  const pend = semanas.find(s => s.sessoes.some(x => !done.has(x.id))) || semanas.at(-1);
  const pausaAgora = t.calendario.find(c => c.pausa && c.inicio <= hoje && hoje <= c.fim);
  const feitas = semanas.reduce((n, s) => n + s.sessoes.filter(x => done.has(x.id)).length, 0);
  const atrasadas = semanas.filter(s => s.fim < hoje).reduce((n, s) => n + s.sessoes.filter(x => !done.has(x.id)).length, 0);
  const link = id => `${t.site}#${id}`;
  const pct = Math.round(feitas / t.totalSessoes * 100);
  const kpi = (label, v, sub, cls = '') => `<div class="kpi ${cls}"><div class="k-label">${esc(label)}</div><div class="k-value" style="font-size:20px">${v}</div><div class="k-sub">${sub}</div></div>`;
  let h = '<div class="kpis">'
    + kpi('Progresso', pct + '%', `${feitas} de ${t.totalSessoes} sessões`)
    + kpi('Semana do calendário', esc(atual.id), esc(atual.titulo))
    + kpi('Próxima a estudar', esc(pend.id), esc(pend.titulo))
    + kpi('Atrasadas', atrasadas, atrasadas ? 'sessões de semanas que já passaram' : 'em dia ✔', atrasadas ? 'neg' : 'pos')
    + '</div>';
  if (pausaAgora) h += `<p class="note">⏸ Semana de pausa: ${esc(pausaAgora.motivo)}.</p>`;
  h += `<p class="note">Os números aparecem certos no navegador em que você marca as sessões no <a href="${esc(t.site)}" target="_blank" rel="noopener">site da trilha ↗</a>.</p>`;
  const semanaCard = (s, rotulo) => `<div class="day${s.id === atual.id ? ' today' : ''}"><h3>${esc(rotulo)} · ${esc(s.id)}<small>${esc(fmtDate(s.inicio))}</small></h3>
      <div class="t-detail" style="margin:0 0 8px">${esc(s.titulo)}</div>
      ${s.sessoes.map(x => `<div class="task ${done.has(x.id) ? 'done baixa' : 'media'}"><span class="t-title">${done.has(x.id) ? '✔' : '○'} ${esc(x.titulo)}</span></div>`).join('')}
      <div class="t-links" style="margin-left:0"><a href="${esc(link(s.id))}" target="_blank" rel="noopener">Abrir no site ↗</a></div></div>`;
  h += '<div class="days" style="margin-top:14px">' + semanaCard(pend, 'Próxima a estudar')
    + (atual.id !== pend.id ? semanaCard(atual, 'Semana do calendário') : '') + '</div>';
  h += `<h2 class="section">Fases</h2><table><thead><tr><th>Fase</th><th>Semanas</th><th>Projetos</th><th class="num">Feito</th></tr></thead><tbody>`
    + t.fases.map(f => {
      const ss = f.semanas.map(id => semanas.find(s => s.id === id));
      const tot = ss.reduce((n, s) => n + s.sessoes.length, 0), ok = ss.reduce((n, s) => n + s.sessoes.filter(x => done.has(x.id)).length, 0);
      return `<tr><td><b>${esc(f.id)}</b> ${esc(f.nome)}</td><td class="muted">${esc(fmtDate(ss[0].inicio))} → ${esc(f.semanas.at(-1))}</td><td class="muted">${f.projetos.map(esc).join('<br>')}</td><td class="num">${Math.round(ok / tot * 100)}%</td></tr>`;
    }).join('') + '</tbody></table>';
  return h;
}

function guiasHTML(area) {
  const hoje = todayISO();
  const dias = iso => Math.round((new Date(iso + 'T12:00:00') - new Date(hoje + 'T12:00:00')) / 864e5);
  const ordem = [...area.guias].sort((a, b) => (a.prova && dias(a.prova) >= 0 ? a.prova : '9') .localeCompare(b.prova && dias(b.prova) >= 0 ? b.prova : '9'));
  let h = '<div class="guias">' + ordem.map(g => {
    const d = g.prova ? dias(g.prova) : null;
    const tag = d === null ? '<span class="g-tag">sem data de prova</span>'
      : d < 0 ? '<span class="g-tag">prova já passou</span>'
      : `<span class="g-tag ${d <= 30 ? 'urg' : ''}">${d === 0 ? 'prova HOJE' : `faltam ${d} dias`} · ${esc(fmtDate(g.prova))}</span>`;
    return `<div class="guia">
      <h3>${esc(g.icone)} ${esc(g.titulo)}</h3>
      <div>${tag}${g.banca ? `<span class="g-tag">${esc(g.banca)}</span>` : ''}</div>
      <p class="t-detail" style="margin:8px 0 0">${esc(g.plano)}</p>
      ${g.aviso ? `<p class="t-deadline" style="margin:6px 0 0">⚠️ ${esc(g.aviso)}</p>` : ''}
      ${g.tutor ? `<p class="t-detail" style="margin:6px 0 0">🧑‍🏫 Tutor: digite <b>${esc(g.tutor)}</b> no Claude Code</p>` : ''}
      <div class="t-links" style="margin:10px 0 0">${g.links.map(([l, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(l)} ↗</a>`).join('')}</div>
      ${g.secao ? `<div class="t-links" style="margin:8px 0 0"><a href="#sec-${esc(g.secao)}">ver detalhes abaixo ↓</a></div>` : ''}
    </div>`;
  }).join('') + '</div>';
  if (area.trilha) h += `<h2 class="section" id="sec-ia">🤖 Engenharia de IA — progresso</h2>` + trilhaHTML(area.trilha);
  if (area.sefaz) h += `<h2 class="section" id="sec-sefaz">🧾 SEFAZ-DF — tarefas e pendências</h2><p class="summary">${esc(area.sefaz.summary)}</p>`
    + area.sefaz.items.map(t => taskHTML(t, true)).join('');
  return h;
}

function renderArea(area) {
  let html = `<p class="summary">${esc(area.summary)}</p>`;
  if (area.guias) html += guiasHTML(area);
  else if (area.trilha) html += trilhaHTML(area.trilha);
  if (area.budget) html += budgetHTML(area.budget);
  if (area.days) {
    const today = todayISO();
    html += '<div class="days">' + area.days.map(d => `
      <div class="day${d.date === today ? ' today' : ''}">
        <h3>${esc(fmtDate(d.date))}${d.date === today ? '<small>HOJE</small>' : ''}</h3>
        ${d.tasks.map(t => taskHTML(t)).join('')}
      </div>`).join('') + '</div>';
  }
  if (area.items) html += (area.budget && area.items.length ? '<h2 class="section">Avisos e pendências</h2>' : '')
    + area.items.map(t => taskHTML(t, true)).join('');
  if (area.applications) {
    html += `<h2 class="section">Candidaturas recentes</h2><table>
      <thead><tr><th>Empresa</th><th>Vaga</th><th>Status</th></tr></thead><tbody>
      ${area.applications.map(a => `<tr><td>${esc(a.company)}</td><td>${esc(a.role)}</td><td>${esc(a.status)}</td></tr>`).join('')}
      </tbody></table>`;
  }
  return html;
}

function pendingHigh(area) {
  const tasks = area.days ? area.days.flatMap(d => d.tasks) : (area.items || []);
  const done = getDone();
  return tasks.filter(t => t.priority === 'alta' && !done.has(t.title)).length;
}

function showApp(data) {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('meta').textContent =
    `Dados lidos do Gmail em ${new Date(data.updatedAt + 'T12:00:00').toLocaleDateString('pt-BR')}`;

  const tabs = document.getElementById('tabs');
  const panel = document.getElementById('panel');
  let current = location.hash.slice(1) || data.areas[0].id;

  function draw() {
    tabs.innerHTML = data.areas.map(a => {
      const n = pendingHigh(a);
      return `<button role="tab" data-id="${a.id}" aria-selected="${a.id === current}">${a.icon} ${esc(a.title)}${n ? `<span class="count">${n}</span>` : ''}</button>`;
    }).join('');
    const area = data.areas.find(a => a.id === current) || data.areas[0];
    panel.innerHTML = renderArea(area);
  }
  tabs.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    current = b.dataset.id; history.replaceState(null, '', '#' + current); draw();
  });
  panel.addEventListener('change', e => {
    if (e.target.type === 'checkbox') { toggleDone(e.target.dataset.id, e.target.checked); draw(); }
  });
  draw();
}

document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('enter'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Entrando…'; err.textContent = '';
  try {
    const pw = document.getElementById('pw').value;
    const data = await decrypt(pw);
    sessionStorage.setItem('alfred-pw', pw);
    showApp(data);
  } catch {
    err.textContent = 'Senha incorreta.';
  } finally {
    btn.disabled = false; btn.textContent = 'Entrar';
  }
});

document.getElementById('logout').addEventListener('click', () => {
  sessionStorage.removeItem('alfred-pw'); location.hash = ''; location.reload();
});

// Keep the session open across reloads within the same tab
const saved = sessionStorage.getItem('alfred-pw');
if (saved) decrypt(saved).then(showApp).catch(() => sessionStorage.removeItem('alfred-pw'));
</script>
